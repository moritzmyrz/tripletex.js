name: Publish package

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Force scoped package to npmjs
        run: |
          npm config set @moritzmyrz:registry https://registry.npmjs.org

      - run: npm ci
      - run: npm test --if-present
      - run: npm run build --if-present

      - run: npm publish --registry https://registry.npmjs.org --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-github-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@moritzmyrz'

      - name: Force scoped package to GitHub Packages
        run: |
          npm config set @moritzmyrz:registry https://npm.pkg.github.com

      - run: npm ci
      - run: npm test --if-present
      - run: npm run build --if-present

      - run: npm publish --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
